[project]
name = "apiproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jojo", email = "leoj8053@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlmodel>=0.0.48",
]

[project.scripts]
apiproject = "apiproject:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "langchain",
]
